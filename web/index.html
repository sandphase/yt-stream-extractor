<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YTDown Studio: Extractor de Medios</title>
    <meta name="description" content="YTDown Studio: Extractor de audio y video de alto rendimiento con procesamiento neural." />
    <script>
      if (window.location.pathname === "/demos/ytdown") {
        window.location.replace("/demos/ytdown/" + window.location.search + window.location.hash);
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      window.tailwind = window.tailwind || {};
      tailwind.config = window.tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Plus Jakarta Sans", "-apple-system", "BlinkMacSystemFont", "Segoe UI", "sans-serif"],
              mono: ["JetBrains Mono", "ui-monospace", "SFMono-Regular", "monospace"],
            },
            colors: {
              studio: "var(--bg)",
              surface: "var(--surface)",
              "surface-raised": "var(--surface-raised)",
              "surface-overlay": "var(--surface-overlay)",
              border: "var(--border)",
              "border-subtle": "var(--border-subtle)",
              "border-hover": "var(--border-hover)",
              accent: "var(--accent)",
              "accent-hover": "var(--accent-hover)",
              "accent-subtle": "var(--accent-subtle)",
            },
          },
        },
      };
    </script>
    <style>
      /* Hallmark: modern-minimal | yt-stream-extractor */
      :root {
        --font-sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
        --bg: #090a0c;
        --surface: #111215;
        --surface-raised: #17181d;
        --surface-overlay: #1d1e24;
        --border: #23252b;
        --border-subtle: #191b20;
        --border-hover: #32353e;
        --text: #f4f4f5;
        --text-muted: #8b8f98;
        --text-dim: #52555e;
        --accent: #e50914;
        --accent-hover: #f40612;
        --accent-subtle: rgba(229, 9, 20, 0.1);
        --accent-border: rgba(229, 9, 20, 0.25);
        --success: #10b981;
        --success-subtle: rgba(16, 185, 129, 0.1);
        --radius-sm: 6px;
        --radius-md: 8px;
        --radius-lg: 12px;
      }
      html, body {
        overflow-x: clip;
        background-color: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: var(--surface);
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 3px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: var(--border-hover);
      }
      @keyframes studioSpin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .initial-loader-spinner { animation: none; }
      }
      .initial-loader {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text-muted);
        font-family: var(--font-sans);
      }
      .initial-loader-spinner {
        width: 14px;
        height: 14px;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: studioSpin 0.8s linear infinite;
      }
    </style>
    <script>
      (function () {
        var p = String(location.port || "");
        if (p === "3000" || p === "5173") {
          window.__API_BASE__ =
            location.protocol + "//" + location.hostname + ":8090";
        } else if (window.location.pathname.indexOf("/demos/ytdown") !== -1) {
          window.__API_BASE__ = "/demos/ytdown";
        } else {
          window.__API_BASE__ = "";
        }
      })();
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="min-h-screen bg-studio text-zinc-100 antialiased selection:bg-accent selection:text-white">
    <div id="root">
      <div class="initial-loader">
        <div class="flex flex-col items-center gap-3.5">
          <div class="flex items-center gap-2">
            <span class="inline-block h-2 w-2 rounded-full bg-accent"></span>
            <span class="text-xs font-semibold text-zinc-100">YTDown Studio</span>
          </div>
          <div class="flex items-center gap-2 text-zinc-500 text-xs">
            <div class="initial-loader-spinner"></div>
            <span>Iniciando entorno neural…</span>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function() {
        var p = window.location.pathname;
        var base = (p.indexOf("/demos/ytdown") !== -1 ? "/demos/ytdown/assets/" : "./assets/");
        var ts = "?v=" + Date.now();
        var s = document.createElement("script");
        s.src = base + "app.js" + ts;
        s.onerror = function() {
          console.warn("app.js no disponible o con error, usando app.jsx");
          var b = document.createElement("script");
          b.type = "text/babel";
          b.src = base + "app.jsx" + ts;
          document.body.appendChild(b);
        };
        document.body.appendChild(s);
      })();
    </script>
  </body>
</html>
