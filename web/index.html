<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YTDown Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      window.tailwind = window.tailwind || {};
      tailwind.config = window.tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Plus Jakarta Sans", "system-ui", "sans-serif"] },
            colors: {
              studio: "#09090b",
              yt: "#FF0000",
              "yt-glow": "rgba(255, 0, 0, 0.4)",
              glass: "rgba(255, 255, 255, 0.03)",
            },
            animation: {
              shimmer: "shimmer 1.4s ease-in-out infinite",
              "pop-in": "popIn 0.45s cubic-bezier(0.34,1.56,0.64,1) forwards",
              glow: "glowPulse 2s ease-in-out infinite",
              glitch: "glitch 0.3s cubic-bezier(.25,.46,.45,.94) both infinite",
              "scan-line": "scanline 8s linear infinite",
            },
            keyframes: {
              shimmer: {
                "0%, 100%": { backgroundPosition: "200% 0" },
                "50%": { backgroundPosition: "-200% 0" },
              },
              popIn: {
                "0%": { opacity: "0", transform: "scale(0.85)" },
                "100%": { opacity: "1", transform: "scale(1)" },
              },
              glowPulse: {
                "0%, 100%": { filter: "brightness(1) drop-shadow(0 0 5px rgba(255,0,0,0.2))" },
                "50%": { filter: "brightness(1.3) drop-shadow(0 0 15px rgba(255,0,0,0.6))" },
              },
              glitch: {
                "0%": { transform: "translate(0)" },
                "20%": { transform: "translate(-2px, 2px)" },
                "40%": { transform: "translate(-2px, -2px)" },
                "60%": { transform: "translate(2px, 2px)" },
                "80%": { transform: "translate(2px, -2px)" },
                "100%": { transform: "translate(0)" },
              },
              scanline: {
                "0%": { transform: "translateY(-100%)" },
                "100%": { transform: "translateY(100%)" },
              }
            },
            boxShadow: {
              neon: "0 0 15px rgba(255, 0, 0, 0.3), 0 0 30px rgba(255, 0, 0, 0.1)",
              "neon-strong": "0 0 20px rgba(255, 0, 0, 0.5), 0 0 40px rgba(255, 0, 0, 0.2)",
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        background-color: #09090b;
        background-image:
          linear-gradient(rgba(255, 0, 0, 0.02) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 0, 0, 0.02) 1px, transparent 1px);
        background-size: 40px 40px;
      }
      .glass-panel {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 0, 0, 0.1);
      }
      .neon-border {
        border: 1px solid #FF0000;
        box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
      }
      .yt-gradient-btn {
        background: linear-gradient(135deg, #FF0000 0%, #990000 100%);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
      }
      .yt-gradient-btn:hover {
        transform: translateY(-2px) scale(1.02);
        box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
        filter: brightness(1.1);
      }
      .progress-glow-yt {
        background: linear-gradient(90deg, #FF0000, #ff4d4d, #FF0000);
        background-size: 200% 100%;
        animation: barShine 1.5s linear infinite;
        box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
      }
      @keyframes barShine {
        0% { background-position: 0% 50%; }
        100% { background-position: 200% 50%; }
      }
      .glitch-hover:hover {
        animation: glitch 0.3s cubic-bezier(.25,.46,.45,.94) both infinite;
      }
      .scanline-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          to bottom,
          transparent 0%,
          rgba(255, 0, 0, 0.03) 50%,
          transparent 100%
        );
        background-size: 100% 4px;
        pointer-events: none;
        z-index: 50;
        opacity: 0.5;
      }
    </style>
    <script>
      (function () {
        var p = String(location.port || "");
        if (p === "3000" || p === "5173") {
          window.__API_BASE__ =
            location.protocol + "//" + location.hostname + ":8090";
        } else {
          window.__API_BASE__ = "";
        }
      })();
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="min-h-screen bg-studio text-zinc-100 antialiased">
    <div id="root"></div>
    <script type="text/babel" src="./assets/app.jsx"></script>
  </body>
</html>
